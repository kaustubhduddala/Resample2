name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            pip_extra: "[gpu]"

          - os: macos-14
            platform: darwin
            pip_extra: "[cpu]"

          - os: macos-15
            platform: darwin
            pip_extra: "[cpu]"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # FIX: Use Python 3.11 to avoid the broken 3.10 libintl error on Mac
      - name: Set up Python (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install FFmpeg (Mac)
        if: matrix.platform == 'darwin'
        run: brew install ffmpeg

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install "audio-separator${{ matrix.pip_extra }}"

      - name: Build with PyInstaller
        run: pyinstaller src/py-service/audio-engine.spec

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-binary-${{ matrix.os }}
          path: dist/audio-engine
          if-no-files-found: error
          overwrite: true
