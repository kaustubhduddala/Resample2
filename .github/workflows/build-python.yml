name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-python:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (NVIDIA GPU support included)
          - os: windows-latest
            platform: windows
            pip_extra: "[gpu]"

          # Mac - Apple Silicon (M1/M2/M3)
          - os: macos-14
            platform: darwin
            pip_extra: "[cpu]"

          # Mac - Intel
          - os: macos-15
            platform: darwin
            pip_extra: "[cpu]"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64" # <-- Explicitly force 64-bit

      # FFmpeg is needed for Mac (Windows usually gets it via static link or user install)
      - name: Install FFmpeg (Mac)
        if: matrix.platform == 'darwin'
        run: brew install ffmpeg

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          # Install the specific version needed
          pip install "audio-separator${{ matrix.pip_extra }}"

      - name: Build with PyInstaller
        # Ensure your spec file path matches this!
        run: pyinstaller src/py-service/audio-engine.spec

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-binary-${{ matrix.os }}
          path: dist/audio-engine
          if-no-files-found: error
          overwrite: true
