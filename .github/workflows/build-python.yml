name: Build and Release

on:
  # This adds the manual "Run workflow" button
  workflow_dispatch:

  # Keep this if you still want it to run on tags later
  push:
    tags:
      - "v*"

jobs:
  build-python:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            pip_extra: "[gpu]" # Windows usually targets NVIDIA
          - os: macos-13 # Intel Mac
            platform: darwin
            pip_extra: "[cpu]"
          - os: macos-14 # Apple Silicon (M1/M2/M3)
            platform: darwin
            pip_extra: "[cpu]" # CoreML is enabled via [cpu] on Mac
          - os: ubuntu-latest
            platform: linux
            pip_extra: "[gpu]"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # FFmpeg handling: For Mac/Linux, usually apt/brew. For Windows, download static.
      - name: Install FFmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install ffmpeg

      - name: Install FFmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # Install dependencies based on Platform
      - name: Install Dependencies
        run: |
          pip install pyinstaller
          pip install "audio-separator${{ matrix.pip_extra }}"

      - name: Build with PyInstaller
        run: pyinstaller py-service/build.spec

      # Upload the artifacts so the Electron build job can pick them up
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: python-binary-${{ matrix.os }}
          path: dist/audio-engine
